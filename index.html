<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Air Pollution System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three-spritetext@1.6.5/dist/three-spritetext.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <script src="https://unpkg.com/d3@7"></script>
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; background: #030305; overflow: hidden; color: #fff; }
    #3d-graph { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    .sidebar {
      position: absolute; left: 0; top: 0; width: 340px; height: 100vh;
      background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 215, 0, 0.1);
      padding: 30px; box-sizing: border-box; 
      z-index: 999; pointer-events: auto;
      display: flex; flex-direction: column; gap: 16px; overflow-y: auto;
    }
    
    h2 { color: #FFD700; font-size: 0.9rem; letter-spacing: 0.1em; margin: 0 0 10px 0; }
    
    .card {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s;
    }
    .card:hover { border-color: #FFD700; background: rgba(255, 215, 0, 0.05); transform: translateX(5px); }
    
    .card-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; }
    .card-adv { color: #10b981; font-size: 0.85rem; margin-bottom: 2px; }
    .card-fail { color: #f43f5e; font-size: 0.85rem; }
    
    .top-nav {
      position: absolute; right: 30px; top: 30px; 
      z-index: 999; pointer-events: auto;
      background: rgba(10,10,12,0.8); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; display: flex; overflow: hidden;
    }
    .nav-btn {
      padding: 10px 20px; background: transparent; color: #aaa; border: none;
      cursor: pointer; font-family: 'Inter'; font-weight: 600; font-size: 0.85rem; transition: 0.2s;
    }
    .nav-btn.active { background: rgba(255,215,0,0.15); color: #FFD700; }
  </style>
</head>
<body>

  <div id="3d-graph"></div>

  <div class="sidebar">
    <h2>INTERVENTIONS</h2>
    <div class="card" data-target="idling">
      <div class="card-title">Anti-idling</div><div class="card-adv">Highly local</div><div class="card-fail">Leaves cruising</div>
    </div>
    <div class="card" data-target="peak">
      <div class="card-title">Peak spreading</div><div class="card-adv">Attacks demand</div><div class="card-fail">Retains vehicles</div>
    </div>
    <div class="card" data-target="street">
      <div class="card-title">School Streets</div><div class="card-adv">Removes source</div><div class="card-fail">Displacement</div>
    </div>
    <div class="card" data-target="barrier">
      <div class="card-title">Green barrier</div><div class="card-adv">Fast reduction</div><div class="card-fail">Ignores emission</div>
    </div>
    <div class="card" data-target="hepa">
      <div class="card-title">Classroom HEPA</div><div class="card-adv">Strong indoor</div><div class="card-fail">High outdoor</div>
    </div>
    <div class="card" data-target="ev">
      <div class="card-title">Electric buses</div><div class="card-adv">Zero tailpipe</div><div class="card-fail">Resuspension</div>
    </div>
  </div>

  <div class="top-nav">
    <button class="nav-btn" id="btn-river">River View</button>
    <button class="nav-btn active" id="btn-rotary">Rotary View</button>
  </div>

  <script>
    const nodes = [];
    const links = [];
    
    const coreSpine = [
      { id: 'SchoolSchedule', label: 'School Schedule', group: 2 },
      { id: 'Arrivals', label: 'Simultaneous Arrivals', group: 2 },
      { id: 'TrafficDemand', label: 'Local Traffic Demand', group: 2 },
      { id: 'QueueIdling', label: 'Queue / Cruising / Idling', group: 2 },
      { id: 'Emissions', label: 'Local NOx / PM', group: 2 },
      { id: 'Hotspot', label: 'School-Gate Concentration', group: 2 },
      { id: 'Dose', label: 'Child Inhaled Dose', group: 2 },
      { id: 'Health', label: 'Health Effects', group: 2 }
    ];
    nodes.push(...coreSpine);
    
    for(let i=0; i<coreSpine.length-1; i++) {
      links.push({ source: coreSpine[i].id, target: coreSpine[i+1].id });
    }
    
    for(let i=0; i<70; i++) {
      nodes.push({ id: `bg_${i}`, label: `Factor ${i}`, group: 1 });
      if (i > 0) links.push({ source: `bg_${i}`, target: `bg_${Math.floor(Math.random() * i)}` });
    }
    
    links.push({ source: 'bg_10', target: 'Emissions' });
    links.push({ source: 'bg_20', target: 'Health' });
    nodes.push({ id: 'AdjacentStreets', label: 'Adjacent Street Traffic', group: 3 });
    links.push({ source: 'TrafficDemand', target: 'AdjacentStreets' });

    let activeSolution = null;
    let isRotary = true;

    function getRenderState(node) {
      if (!activeSolution) {
        return { 
          color: node.group === 2 ? '#FFD700' : '#444444', 
          bg: node.group === 2 ? 'rgba(30,30,30,0.9)' : 'rgba(15,15,15,0.4)',
          opacity: node.group === 2 ? 1 : 0.2 
        };
      }
      
      let isTarget = false;
      let isFailure = false;
      
      if (activeSolution === 'idling') {
        if (node.id === 'QueueIdling') isTarget = true;
        if (['Arrivals', 'TrafficDemand'].includes(node.id)) isFailure = true;
      } else if (activeSolution === 'peak') {
        if (node.id === 'Arrivals') isTarget = true;
        if (node.id === 'SchoolSchedule') isFailure = true;
      } else if (activeSolution === 'street') {
        if (['Emissions', 'Hotspot'].includes(node.id)) isTarget = true;
        if (node.id === 'AdjacentStreets') isFailure = true;
      } else if (activeSolution === 'barrier') {
        if (node.id === 'Hotspot') isTarget = true;
        if (node.id === 'Emissions') isFailure = true;
      } else if (activeSolution === 'hepa') {
        if (node.id === 'Dose') isTarget = true;
        if (node.id === 'Hotspot') isFailure = true;
      } else if (activeSolution === 'ev') {
        if (node.id === 'Emissions') isTarget = true;
        if (['QueueIdling', 'TrafficDemand'].includes(node.id)) isFailure = true;
      }

      if (isTarget) return { color: '#10b981', bg: 'rgba(16, 185, 129, 0.2)', opacity: 1 };
      if (isFailure) return { color: '#f43f5e', bg: 'rgba(244, 63, 94, 0.2)', opacity: 1 };
      
      return { color: '#222222', bg: 'rgba(10,10,10,0.1)', opacity: 0.05 }; 
    }

    try {
      const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
        .graphData({ nodes, links })
        .backgroundColor('#030305')
        .nodeThreeObject(node => {
          const state = getRenderState(node);
          const sprite = new SpriteText(node.label);
          sprite.color = state.color;
          sprite.textHeight = node.group === 2 || state.opacity === 1 ? 6 : 3;
          sprite.backgroundColor = state.bg;
          sprite.padding = 3;
          sprite.borderRadius = 4;
          sprite.material.transparent = true;
          sprite.material.opacity = state.opacity;
          sprite.material.depthWrite = false; 
          return sprite;
        })
        .linkColor(link => (!activeSolution && link.source.group === 2 && link.target.group === 2) ? 'rgba(255,215,0,0.3)' : 'rgba(255,255,255,0.05)')
        .linkWidth(link => (!activeSolution && link.source.group === 2 && link.target.group === 2) ? 1.5 : 0.5);

      // Default Rotary View Physics
      Graph.d3Force('radial', d3.forceRadial(d => d.group === 1 ? 400 : 0))
           .d3Force('charge', d3.forceManyBody().strength(-80));

      let angle = 0;
      setInterval(() => {
        if (!activeSolution && isRotary) {
          Graph.cameraPosition({ x: 600 * Math.sin(angle), z: 600 * Math.cos(angle) });
          angle += Math.PI / 4000;
        }
      }, 20);

      // UI View Toggles
      const btnRiver = document.getElementById('btn-river');
      const btnRotary = document.getElementById('btn-rotary');

      btnRiver.addEventListener('click', () => {
        isRotary = false;
        btnRiver.classList.add('active');
        btnRotary.classList.remove('active');
        
        Graph.d3Force('radial', null)
             .d3Force('x', d3.forceX(d => {
                if (d.group === 2) {
                  const idx = coreSpine.findIndex(n => n.id === d.id);
                  return (idx - 3.5) * 160; 
                }
                return (Math.random() - 0.5) * 1000;
             }).strength(d => d.group === 2 ? 1 : 0.03))
             .d3Force('y', d3.forceY(0).strength(0.05))
             .d3Force('z', d3.forceZ(0).strength(0.05))
             .d3Force('charge', d3.forceManyBody().strength(-150));
             
        Graph.cameraPosition({ x: 0, y: 0, z: 1200 }, { x: 0, y: 0, z: 0 }, 1500);
      });

      btnRotary.addEventListener('click', () => {
        isRotary = true;
        btnRotary.classList.add('active');
        btnRiver.classList.remove('active');
        
        Graph.d3Force('x', null).d3Force('y', null).d3Force('z', null)
             .d3Force('radial', d3.forceRadial(d => d.group === 1 ? 400 : 0))
             .d3Force('charge', d3.forceManyBody().strength(-80));
      });

      // Hover Isolation Triggers
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mouseenter', (e) => {
          activeSolution = e.currentTarget.getAttribute('data-target');
          Graph.nodeThreeObject(Graph.nodeThreeObject()); 
        });
        card.addEventListener('mouseleave', () => {
          activeSolution = null;
          Graph.nodeThreeObject(Graph.nodeThreeObject());
        });
      });

      window.addEventListener('resize', () => Graph.width(window.innerWidth).height(window.innerHeight));
    } catch (error) {
      console.error("WebGL Rendering Error:", error);
    }
  </script>
</body>
</html>
