<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e11" />
  <title>AGRL130 archive</title>
  <meta name="description" content="AGRL130 weeks 2 to 5: from an air pollution systems map to Dry Rooms. Nambiar, Jamsandekar, Tiju." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%230b0e11'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%23e8774a' stroke-width='9'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0b0e11; --surface: #11161b; --line: rgba(230,236,242,0.09); --line-2: rgba(230,236,242,0.16); --text: #e6e9ec; --muted: #96a1ab; --dim: #66717c; --heat: #e8774a; --r: 4px; --gut: clamp(16px, 4vw, 56px); --mono: "Geist Mono", ui-monospace, monospace; --ease: cubic-bezier(0.16, 1, 0.3, 1); }
    * { box-sizing: border-box; }
    html { background: var(--bg); color: var(--text); font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1320px; margin: 0 auto; padding: 0 var(--gut); }
    .nav { height: 64px; display: flex; align-items: center; }
    .nav .wrap { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .mark { font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
    .nav a.l { color: var(--muted); font-size: 13px; }
    .nav a.l:hover { color: var(--text); }
    h1 { margin: 48px 0 0; font-size: clamp(40px, 6vw, 88px); font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
    h1 i { font-style: italic; font-weight: 300; color: var(--heat); }
    .grid { margin: 56px 0 96px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
    .card { position: relative; display: block; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--surface); opacity: 0; transform: translateY(18px); transition: opacity .9s var(--ease), transform .9s var(--ease), border-color .3s; }
    .card.in { opacity: 1; transform: none; }
    .card:hover { border-color: var(--line-2); }
    .card .img { aspect-ratio: 16 / 10; overflow: hidden; }
    .card img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; transition: transform 1.2s var(--ease); }
    .card:hover img { transform: scale(1.035); }
    .card .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 16px 18px 18px; }
    .card h2 { margin: 0; font-size: clamp(18px, 1.7vw, 24px); font-weight: 500; letter-spacing: -0.025em; }
    .card .wk { font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: nowrap; }
    .card.now .wk { color: var(--heat); }
    .c5 { grid-column: span 7; } .c4 { grid-column: span 5; } .c3 { grid-column: span 6; } .c2 { grid-column: span 6; }
    .c4 .img, .c5 .img { aspect-ratio: auto; height: clamp(240px, 30vw, 420px); }
    .arrow { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(11,14,17,.75); color: var(--text); font-size: 15px; opacity: 0; transform: translateY(4px); transition: all .4s var(--ease); }
    .card:hover .arrow { opacity: 1; transform: none; }
    footer { border-top: 1px solid var(--line); padding: 28px 0 44px; color: var(--muted); font-size: 13px; }
    footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    footer a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
    @media (max-width: 860px) { .c5, .c4, .c3, .c2 { grid-column: span 12; } .c4 .img, .c5 .img { height: auto; aspect-ratio: 16 / 10; } }
    @media (prefers-reduced-motion: reduce) { .card { opacity: 1; transform: none; transition: none; } .card img { transition: none; } }
  </style>
</head>
<body>
  <header class="nav"><div class="wrap"><a class="mark" href="../">AGRL130</a><a class="l" href="../">Week 5</a></div></header>
  <main class="wrap">
    <h1>Four weeks, <i>four ideas.</i></h1>
    <div class="grid">
      <a class="card now c5" href="../"><div class="img"><img src="week5.jpg" alt="Week 5, Dry Rooms, a 3D model of the system" loading="lazy" /></div><div class="cap"><h2>Dry Rooms</h2><span class="wk">week 5, now</span></div><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="card c4" href="../week4/"><div class="img"><img src="week4-w2.jpg" alt="Week 4, Clean School Zones, a priority matrix" loading="lazy" /></div><div class="cap"><h2>Clean School Zones</h2><span class="wk">week 4</span></div><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="card c3" href="../week3/"><div class="img"><img src="week3.jpg" alt="Week 3, Clean Cabin, a 3D evidence graph" loading="lazy" /></div><div class="cap"><h2>Clean Cabin</h2><span class="wk">week 3</span></div><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="card c2" href="../week2/"><div class="img"><img src="week2.jpg" alt="Week 2, the air pollution systems map" loading="lazy" /></div><div class="cap"><h2>Air pollution systems map</h2><span class="wk">week 2</span></div><span class="arrow" aria-hidden="true">↗</span></a>
    </div>
  </main>
  <footer><div class="wrap"><span>Karthik Nambiar, Sumedh Nitin Jamsandekar, Paul Tiju. IIT Delhi Abu Dhabi.</span><span><a href="../report.pdf" target="_blank" rel="noopener">Week 5 report</a> &nbsp; <a href="../week3/report.pdf" target="_blank" rel="noopener">Week 3 report</a> &nbsp; <a href="../week4/week4.pptx">Week 4 slides</a></span></div></footer>
  <script>
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.1 });
    document.querySelectorAll('.card').forEach((c, i) => { c.style.transitionDelay = (i * 80) + 'ms'; io.observe(c); });
  </script>
</body>
</html>
