<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Dry Rooms control</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0b0e11; --surface: #11161b; --line: rgba(230,236,242,0.12); --text: #e6e9ec; --muted: #96a1ab; --dim: #66717c; --heat: #e8774a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Geist, system-ui, sans-serif; padding: 20px 16px 40px; max-width: 560px; margin-inline: auto; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
    h1 { font-size: 18px; margin: 0; letter-spacing: -0.02em; }
    .st { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--dim); }
    .st.on { color: var(--heat); }
    .now { font-family: "Geist Mono", monospace; font-size: 13px; color: var(--muted); }
    .now b { display: block; font-family: Geist, sans-serif; font-size: 26px; color: var(--text); letter-spacing: -0.03em; margin-top: 4px; }
    .nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin: 18px 0 22px; }
    button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; cursor: pointer; }
    button:active { transform: scale(0.98); }
    .nav button { font-size: 18px; font-weight: 600; padding: 22px 14px; }
    .nav .next { background: var(--heat); border-color: var(--heat); color: #170b05; }
    .list { display: grid; gap: 6px; }
    .list button { display: flex; gap: 12px; text-align: left; font-size: 14px; }
    .list button span { font-family: "Geist Mono", monospace; color: var(--dim); width: 2ch; }
    .list button.cur { border-color: var(--heat); }
    .list button.cur span { color: var(--heat); }
    h2 { font-size: 12px; font-family: "Geist Mono", monospace; color: var(--dim); font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em; margin: 26px 0 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hint { font-size: 12px; color: var(--dim); margin-top: 26px; line-height: 1.5; }
  </style>
</head>
<body>
  <header><h1>Dry Rooms control</h1><span class="st" id="st">no deck</span></header>
  <div class="now" id="now">Open the deck in another tab<b>–</b></div>
  <div class="nav"><button id="prev">Back</button><button class="next" id="next">Next</button></div>
  <div class="list" id="list"></div>
  <h2>Site</h2>
  <div class="row"><button data-site="abu-dhabi">Abu Dhabi</button><button data-site="dubai">Dubai</button></div>
  <p class="hint">Works in the same browser on this laptop: deck in one window, this page in another. Arrow keys also work here.</p>
  <script>
    const ch = new BroadcastChannel('dry-rooms-deck');
    const $ = id => document.getElementById(id);
    let titles = [], cur = 0;
    const send = m => ch.postMessage(m);
    function render() {
      $('now').innerHTML = `Slide ${cur + 1} of ${titles.length}<b>${titles[cur] || ''}</b>`;
      $('list').innerHTML = titles.map((t, i) => `<button data-i="${i}" class="${i === cur ? 'cur' : ''}"><span>${i + 1}</span>${t}</button>`).join('');
    }
    ch.onmessage = ({ data: m }) => { if (m.type !== 'at') return; titles = m.titles; cur = m.i; $('st').textContent = 'connected'; $('st').classList.add('on'); render(); };
    $('prev').onclick = () => send({ type: 'step', d: -1 });
    $('next').onclick = () => send({ type: 'step', d: 1 });
    $('list').onclick = e => { const b = e.target.closest('button'); if (b) send({ type: 'go', i: +b.dataset.i }); };
    document.querySelectorAll('[data-site]').forEach(b => b.onclick = () => send({ type: 'site', site: b.dataset.site }));
    addEventListener('keydown', e => {
      if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); send({ type: 'step', d: 1 }); }
      if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); send({ type: 'step', d: -1 }); }
    });
    send({ type: 'hello' });
    setInterval(() => { if (!titles.length) send({ type: 'hello' }); }, 1500);
  </script>
</body>
</html>
